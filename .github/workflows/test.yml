name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # Single source for the pinned actionlint version. The dedicated actionlint
  # job lints every workflow; the test matrix needs the same binary because the
  # suite asserts the security workflows lint clean and treats an unavailable
  # binary as a hard failure under CI.
  ACTIONLINT_VERSION: '1.7.7'

jobs:
  package-files-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Validate package.json files allowlist
        shell: bash
        run: |
          ALLOWED='bin commands gsd-ng agents hooks CHANGELOG.md'
          FILES=$(node -p "require('./package.json').files.join(' ')")
          for entry in $FILES; do
            if ! echo "$ALLOWED" | grep -qw "$entry"; then
              echo "::error::package.json files contain '$entry' which is not in the allowlist: $ALLOWED"
              exit 1
            fi
          done
          echo "package.json files OK: $FILES"

  changelog-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Check CHANGELOG updated
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -q 'CHANGELOG.md'; then
            echo "CHANGELOG.md updated"
          else
            if [ "$BASE_REF" = "main" ]; then
              echo "::error::CHANGELOG.md must be updated for PRs to main"
              exit 1
            else
              echo "::warning::CHANGELOG.md was not updated in this PR"
            fi
          fi

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The suite treats an absent actionlint as a hard failure when CI=true.
      - name: Install actionlint
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) AL_OS=linux ;;
            macOS) AL_OS=darwin ;;
            *) echo "::error::unsupported runner OS for actionlint: $RUNNER_OS"; exit 1 ;;
          esac
          case "$RUNNER_ARCH" in
            X64) AL_ARCH=amd64 ;;
            ARM64) AL_ARCH=arm64 ;;
            *) echo "::error::unsupported runner arch for actionlint: $RUNNER_ARCH"; exit 1 ;;
          esac
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_${AL_OS}_${AL_ARCH}.tar.gz" -o "$RUNNER_TEMP/actionlint.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$HOME/.local/bin" actionlint
          chmod +x "$HOME/.local/bin/actionlint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          actionlint --version

      - name: Run tests with coverage
        shell: bash
        run: npm run test:coverage

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install actionlint
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C "$HOME/.local/bin" actionlint
          chmod +x "$HOME/.local/bin/actionlint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          actionlint --version

      - name: Lint GitHub Actions workflows
        shell: bash
        run: actionlint .github/workflows/*.yml
