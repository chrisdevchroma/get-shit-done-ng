name: Security Scan

on:
  # Must stay unfiltered: `security-gate` is a required status check, and a
  # required context on a path-filtered workflow deadlocks — a pull request
  # outside the filter never starts the workflow, so the status it waits on is
  # never posted. Scope is applied to changed files by SCAN_PATHS in
  # scripts/ci-security-scan.cjs instead.
  pull_request_target:

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch (trusted)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        # No ref specified — defaults to default branch (trusted execution model)
        # PR diff data is fetched via GitHub API in ci-security-scan.cjs, not via checkout

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Run security scan
        id: scan
        # Deferred so the gate status is always published, including on a
        # blocking verdict. The job is failed again by the final step.
        continue-on-error: true
        # `outcome` cannot tell a blocking finding (exit 1) from a scan that
        # never completed (exit 2); the gate description differs between them.
        run: |
          set +e
          node scripts/ci-security-scan.cjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      # Publishes the `security-gate` commit status. This is the context to
      # make required under branch protection; the override supersedes it by
      # posting a newer status — see scripts/security-gate.cjs.
      - name: Publish security-gate commit status
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          SCAN_EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { classifyScanOutcome, publishGateVerdict } = require(
              `${process.env.GITHUB_WORKSPACE}/scripts/security-gate.cjs`
            );
            const verdict = classifyScanOutcome({
              outcome: process.env.SCAN_OUTCOME,
              exitCode: process.env.SCAN_EXIT_CODE,
            });
            const status = await publishGateVerdict({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              headSha: context.payload.pull_request.head.sha,
              blocked: verdict.blocked,
              incomplete: verdict.incomplete,
            });
            core.info(`Published ${status.context} status: ${status.state}`);

      - name: Fail job on blocking verdict
        if: steps.scan.outcome != 'success'
        run: |
          echo "Security scan reported a blocking verdict."
          exit 1
