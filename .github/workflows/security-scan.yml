name: Security Scan

on:
  pull_request_target:
    # Must stay set-equal to SCAN_PATHS in scripts/ci-security-scan.cjs.
    # A path listed there but missing here never starts this workflow.
    paths:
      - '.claude/**'
      - '.github/**'
      - '.planning/**'
      - 'agents/**'
      - 'assets/**'
      - 'bin/**'
      - 'commands/**'
      - 'docs/**'
      - 'gsd-ng/**'
      - 'hooks/**'
      - 'scripts/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'

permissions:
  checks: write
  pull-requests: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch (trusted)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        # No ref specified — defaults to default branch (trusted execution model)
        # PR diff data is fetched via GitHub API in ci-security-scan.cjs, not via checkout

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Run security scan
        run: node scripts/ci-security-scan.cjs
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
