name: Security Override

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  process-override:
    # Only run on PR comments matching the override pattern
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/security-override:')
    runs-on: ubuntu-latest
    steps:
      # The default branch is checked out only to load the override logic.
      # This workflow runs on issue_comment, so the checkout is of the base
      # repository and never of contributor-supplied code.
      - name: Checkout default branch (trusted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify permissions and process override
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { processOverride } = require(
              `${process.env.GITHUB_WORKSPACE}/scripts/security-gate.cjs`
            );
            const result = await processOverride({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              prNumber: context.payload.issue.number,
              comment: context.payload.comment,
            });
            if (result.status === 'rejected') {
              core.setFailed(result.message);
              return;
            }
            core.info(result.message);
            // The comment itself is the permanent audit trail — no deletion
